[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cba-customer-intelligence"
version = "0.1.0"
description = "End-to-end customer-feedback intelligence pipeline: collect, process, categorise, analyse, recommend, publish."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "requests>=2.31", "openpyxl>=3.1", "vaderSentiment>=3.3"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
collect = ["google-play-scraper>=1.2", "praw>=7.7"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
ci = "ci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ci = ["ui/templates/*", "ui/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
